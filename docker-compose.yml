version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: researchos-db
    environment:
      POSTGRES_USER: researchos
      POSTGRES_PASSWORD: researchos_secret
      POSTGRES_DB: researchos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchos -d researchos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchos-backend
    environment:
      DATABASE_URL: postgresql://researchos:researchos_secret@postgres:5432/researchos
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: all-MiniLM-L6-v2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

volumes:
  postgres_data:
