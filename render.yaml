services:
  - type: web
    name: researchos-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: PYTHONPATH
        value: .
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: DATABASE_URL
        value: sqlite:///./data/researchos.db
      - key: STORAGE_DIR
        value: ./data/storage
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: EMBEDDING_PROVIDER
        value: sentence_transformers
